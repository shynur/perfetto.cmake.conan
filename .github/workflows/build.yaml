# A GitHub Action that can be triggered manually or by a push (on trunk) event.
# It is used to generate the `install/` directory for perfetto.
#
# Tips:
# - Use username `cnb` and password `${{ secrets.CNBCOOL_TOKEN }}` to log in to <docker.cnb.cool>
# - Clone this repository using a method equivalent to `git clone --recurse-submodules --depth=1`
# - The tag of the submodule `perfetto` is always in the format of `v*`.  To get the version number, you need to remove the leading `v`.
#
# How:
# 1. Based on the current commit, create a tag in the format of `v<perfetto version number>+<date>` (where the date is generated by `date +%Y%m%d%H%M`), and push it to the remote repository.
# 2. In the repository directory, execute `make install`, which will build and install `perfetto` to `./install/`.
# 3. Execute `tar -cvf install-$HOSTTYPE.tar.gz -I 'gzip -9' ./install/` to generate the file `install-*.tar.gz`.
# 4. Push the artifact `install-*.tar.gz` (force overwrite if it already exists) to the GitHub Release page corresponding to the tag created above.
#
# Build in parallel based on two docker images:
# - `docker.cnb.cool/seer-robotics/robokit/release/build-kit:x86_64-1.0.3`: Target is x64.
# - `docker.cnb.cool/seer-robotics/robokit/release/build-kit:multi-latest`: Target is arm64 (cross build).  Build the artifact with `SEER_RBK_PERFETTO_CMAKE_BUILD_FLAGS=-DCMAKE_TOOLCHAIN_FILE=/opt/toolchain.cmake make install`

name: Build
on:
  workflow_dispatch:
  push:
    branches:
      - trunk
permissions:
  contents: write
jobs:
  prepare:
    name: Prepare Release Tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Resolve perfetto version and release tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          git -C perfetto fetch --tags --force
          perfetto_tag=`git -C perfetto describe --tags --abbrev=0 --match 'v*'`
          perfetto_version=${perfetto_tag#v}
          release_tag=v$perfetto_version+`TZ=Asia/Shanghai date +%Y%m%d%H%M`
          echo release_tag=$release_tag >>$GITHUB_OUTPUT
          echo RELEASE_TAG=$release_tag >>$GITHUB_ENV
      - name: Create Tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f $RELEASE_TAG
          git push --force origin refs/tags/$RELEASE_TAG
      - name: Ensure GitHub Release Exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view $RELEASE_TAG &>/dev/null; then
            gh release create $RELEASE_TAG --title $RELEASE_TAG --notes ''
          fi
  build:
    name: Build ${{ matrix.target-arch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target-arch: x64
            image: docker.cnb.cool/seer-robotics/robokit/release/build-kit:x86_64-1.0.3
          - target-arch: arm64
            image: docker.cnb.cool/seer-robotics/robokit/release/build-kit:multi-latest
    steps:
      - name: Checkout repository (shallow + submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Login to docker.cnb.cool
        uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNBCOOL_TOKEN }}
      - name: Build install and archive
        shell: bash
        run: |
          set -euo pipefail
          docker pull ${{ matrix.image }} >/dev/null
          docker run --rm -v `pwd`/:/ws/ --workdir /ws ${{ matrix.image }} bash -c '
            set -euo pipefail
            if [ ${{ matrix.target-arch }} = arm64 ]; then
              export SEER_RBK_PERFETTO_CMAKE_BUILD_FLAGS=-DCMAKE_TOOLCHAIN_FILE=/opt/toolchain.cmake
            fi
            make install
            mv install{,-${{ matrix.target-arch }}}
          '
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: install-${{ matrix.target-arch }}
          path: install-${{ matrix.target-arch }}/
          if-no-files-found: error
  release:
    name: Upload release assets
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: install-*
          path: dist
          merge-multiple: true
      - name: Upload artifacts to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/install-*/)
          if [ ${#files[@]} !=2 ]; then
            echo "Got ${#files[@]} artifacts, expected 2"
            exit 1
          fi
          (
            cd dist
            for d in install-*/; do
              d=`basename $d`
              tar -cvf $d.tar.gz -I 'gzip -9' $d/
            done
          )
          gh release upload $RELEASE_TAG dist/install-*.tar.gz --clobber
